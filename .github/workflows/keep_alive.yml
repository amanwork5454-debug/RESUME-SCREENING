name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 * * * *'  # Runs every 1 hour
  workflow_dispatch:  # Allows manual trigger

jobs:
  wake_up:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Wake up Streamlit App
        run: |
          python - <<'EOF'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import time

          STREAMLIT_URL = "https://aman-resume-screening.streamlit.app/"

          options = Options()
          options.add_argument("--headless")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.binary_location = "/usr/bin/chromium-browser"

          driver = webdriver.Chrome(options=options)

          try:
              print(f"Visiting {STREAMLIT_URL}...")
              driver.get(STREAMLIT_URL)
              time.sleep(5)

              # Check if the wake-up button exists and click it
              try:
                  wake_button = WebDriverWait(driver, 10).until(
                      EC.element_to_be_clickable((By.XPATH, "//button[contains(text(), 'Yes, get this app back up')]"))
                  )
                  wake_button.click()
                  print("✅ Wake-up button clicked! App is waking up...")
                  time.sleep(10)
              except:
                  print("✅ App is already awake! No action needed.")

          except Exception as e:
              print(f"❌ Error: {e}")
              exit(1)

          finally:
              driver.quit()
              print("Done.")
          EOF
